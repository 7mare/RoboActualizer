# @package _global_
# 300M DiT-B on LIBERO (LIBERO-Plus 65.0 with CFG 1.5; checkpoint: step_130185).
defaults:
  - override /data: libero_2cam
  - override /model: joint_predict_fm_libero
  - _self_

run_name: libero_wm_ditb_rope_noattn_ind_mlp_latnorm_clip4int2_ratio4_32_ep15_2e-4
output_dir: ./runs/${run_name}

model:
  dit_size: b
  latent_norm_stats_path: ./data/int2_clip4/libero/latent_norm_stats.json

batch_size: 32
num_workers: 8
lr_scheduler_type: cosine
learning_rate: 2e-4
num_epochs: 15
max_steps: null
log_every: 10
save_every: 5000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null

wandb:
  name: ${run_name}
